[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "howlongwithoutraids-pipeline"
version = "0.1.0"
description = "ETL local de How Long Without Raids. Solo entorno de datos."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "mwparserfromhell>=0.6",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["raids*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
  "integration: requiere PostgreSQL local en Docker; se excluye con -m 'not integration'",
]
addopts = "-ra"
