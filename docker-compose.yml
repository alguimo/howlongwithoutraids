services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: raids
      POSTGRES_PASSWORD: raids
      POSTGRES_DB: raids
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raids -d raids"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
